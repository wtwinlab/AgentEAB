<title id="t">SHARE-Eval suite overview</title>
<desc id="d">Protocol and task adapters run multi-agent consensus workflows and log execution records. Stage evaluation and alternative comparisons read these records and produce reports on stage metrics, final quality, cost, and confidence intervals. Comparisons replay recorded inputs when dependencies permit and otherwise execute the workflow again.</desc>
